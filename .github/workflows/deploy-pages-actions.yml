name: Deploy No-Thread Preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'index.html'
      - 'index.js'
      - 'index.wasm'
      - 'index.pck'
      - 'index.png'
      - 'index.icon.png'
      - 'index.apple-touch-icon.png'
      - 'index.audio.worklet.js'
      - 'index.audio.position.worklet.js'
      - '.github/workflows/deploy-pages-actions.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout no-thread site
        uses: actions/checkout@v4

      - name: Verify no-thread Godot export
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s index.js
          test -s index.wasm
          test -s index.pck
          grep -Fq 'const GODOT_THREADS_ENABLED = false;' index.html
          grep -Fq '"emscriptenPoolSize":0' index.html
          grep -Fq '"godotPoolSize":0' index.html
          ! grep -Fq 'Cross-Origin Isolation - Check that the web server configuration sends the correct headers.' index.html
          echo 'GODOT_NO_THREAD_STATIC_HOSTING: PASS'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload no-thread site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy no-thread site
        id: deployment
        uses: actions/deploy-pages@v4
