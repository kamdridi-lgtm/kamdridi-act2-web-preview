name: Deploy Mission 068 to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'index.html'
      - 'index.js'
      - 'index.wasm'
      - 'index.pck'
      - 'index.png'
      - 'index.icon.png'
      - 'index.apple-touch-icon.png'
      - 'index.audio.worklet.js'
      - 'index.audio.position.worklet.js'
      - 'MISSION_068_BUILD.txt'
      - '.github/workflows/deploy-pages-actions.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-mission-068
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Mission 068 site
        uses: actions/checkout@v4

      - name: Verify Mission 068 no-thread export
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s index.js
          test -s index.wasm
          test -s index.pck
          test -s MISSION_068_BUILD.txt
          grep -Fq 'MISSION=068' MISSION_068_BUILD.txt
          grep -Fq 'SOURCE_COMMIT=06791193d65154d7e131e094229b70f0517002fc' MISSION_068_BUILD.txt
          grep -Fq 'VISUAL_PROOF=PASS' MISSION_068_BUILD.txt
          grep -Fq 'const GODOT_THREADS_ENABLED = false;' index.html
          grep -Fq '"emscriptenPoolSize":0' index.html
          grep -Fq '"godotPoolSize":0' index.html
          ! grep -Fq 'SharedArrayBuffer' index.html
          ! grep -Fq 'Cross-Origin Isolation - Check that the web server configuration sends the correct headers.' index.html
          echo 'MISSION_068_GITHUB_PAGES_GATE: PASS'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Mission 068 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Mission 068 site
        id: deployment
        uses: actions/deploy-pages@v4
